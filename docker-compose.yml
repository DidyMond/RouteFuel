services:
  db:
    image: postgis/postgis:16-3.4
    container_name: routefuel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: routefuel
      POSTGRES_PASSWORD: routefuel
      POSTGRES_DB: routefuel
    ports:
      - "5432:5432"
    volumes:
      - routefuel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routefuel -d routefuel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  routefuel-db-data:
