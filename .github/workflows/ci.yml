# CI di RouteFuel: un solo workflow e un solo job, per restare entro i 2.000 minuti/mese del piano free privato.
# Esegue i test ermetici (zero rete, zero database: `pnpm test`) e il typecheck. I test su PostgreSQL (`pnpm test:db`)
# non girano qui: richiedono un database e si lanciano in locale.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/*"

permissions:
  contents: read

# Un nuovo push sullo stesso riferimento annulla la run precedente ancora in corso: meno minuti consumati.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # La versione di pnpm viene da `packageManager` in package.json (12.6.0): non va ripetuta qui.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm typecheck
